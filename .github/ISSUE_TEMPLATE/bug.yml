name: Bug report
description: Report a reproducible problem with synthetic data
title: "Bug: "
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use synthetic data only. Do not include private files, credentials or personal paths.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
    validations:
      required: true
